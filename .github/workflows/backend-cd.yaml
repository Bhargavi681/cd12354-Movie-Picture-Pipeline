name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: starter/backend

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint

  test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test

  build:
    name: Backend Build and Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    permissions:
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: 538519242266.dkr.ecr.us-east-1.amazonaws.com/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: starter/backend
        run: |
          docker build \
            --tag $ECR_REPOSITORY:${{ github.sha }} \
            .
          docker push $ECR_REPOSITORY:${{ github.sha }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name cluster --region $AWS_REGION

      - name: Deploy to Kubernetes
        working-directory: starter/backend/k8s
        run: |
          kubectl kustomize . | \
            sed "s#image: backend#image: $ECR_REPOSITORY:${{ github.sha }}#" | \
            kubectl apply -f -
