name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: starter/frontend

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Frontend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CI: true

  build:
    name: Frontend Build and Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    permissions:
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: 538519242266.dkr.ecr.us-east-1.amazonaws.com/frontend
      REACT_APP_MOVIE_API_URL: http://a8de4be298c46495eb0b1033e647e5db-1550474936.us-east-1.elb.amazonaws.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=$REACT_APP_MOVIE_API_URL \
            --tag $ECR_REPOSITORY:${{ github.sha }} \
            .
          docker push $ECR_REPOSITORY:${{ github.sha }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name cluster --region $AWS_REGION

      - name: Deploy to Kubernetes
        working-directory: starter/frontend/k8s
        run: |
          kubectl kustomize . | \
            sed "s#image: frontend#image: $ECR_REPOSITORY:${{ github.sha }}#" | \
            kubectl apply -f -
